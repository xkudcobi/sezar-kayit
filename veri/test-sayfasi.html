<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Kayıt motoru test sayfası</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; color: #1f2330; background: #f6f7fb; display: grid; grid-template-columns: 240px 1fr; height: 100vh; }
  nav { background: #fff; border-right: 1px solid #e3e5ee; padding: 24px 16px; }
  nav a { display: block; padding: 8px 12px; border-radius: 8px; color: inherit; text-decoration: none; }
  nav a:hover { background: #eef0ff; color: #4f46e5; }
  main { overflow-y: auto; padding: 40px 56px; }
  .kart { background: #fff; border: 1px solid #e3e5ee; border-radius: 12px; padding: 24px; margin-bottom: 24px; max-width: 760px; }
  input { font: inherit; padding: 10px 12px; border: 1px solid #cfd3e1; border-radius: 8px; width: 320px; }
  button { font: inherit; padding: 10px 18px; border: 0; border-radius: 8px; background: #4f46e5; color: #fff; cursor: pointer; }
  #sonuc { margin-top: 12px; color: #16794c; min-height: 1.5em; }
  .uzun { height: 900px; background: repeating-linear-gradient(180deg, #fff 0 60px, #f1f2f8 60px 120px); }
  @media (max-width: 600px) { body { grid-template-columns: 1fr; } nav { display: none; } main { padding: 20px; } input { width: 100%; } }
</style>
</head>
<body>
<nav>
  <strong style="display:block;margin:0 12px 16px">Test Kurumu</strong>
  <a href="#" data-tour="bugun">Bugün</a>
  <a href="#">Takvim</a>
  <a href="#" data-tour="ogrenciler">Öğrenciler</a>
  <a href="#">Finans</a>
</nav>
<main>
  <div class="kart"><h1 style="margin:0">Hoş geldiniz</h1><p>Bu sayfa yalnızca kayıt motorunu denemek içindir. İçindeki adlar uydurmadır.</p></div>
  <div class="kart uzun"></div>
  <div class="kart" id="form-karti">
    <h2 style="margin-top:0">Yeni öğrenci</h2>
    <input name="ad" placeholder="Ad soyad">
    <button id="kaydet">Kaydet</button>
    <div id="sonuc"></div>
  </div>
  <div class="kart uzun"></div>
</main>
<script>
  document.getElementById("kaydet").onclick = () => {
    const v = document.querySelector("input[name=ad]").value;
    document.getElementById("sonuc").textContent = v ? `${v} kaydedildi ✓` : "Ad boş olamaz";
  };
</script>
</body>
</html>
